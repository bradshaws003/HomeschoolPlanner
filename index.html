<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homeschool Lesson Plan Book</title>
    <style>
        :root {
            --primary: #3182ce;
            --primary-hover: #2b6cb0;
            --tobias-main: #2b6cb0;
            --tobias-bg: #f0f9ff;
            --ariella-main: #d53f8c;
            --ariella-bg: #fff5f7;
            --joint-main: #d69e2e;
            --joint-bg: #fffff0;
            --text: #2d3748;
            --bg-body: #f8fafc;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text);
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 1450px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            background: #ffffff;
            padding: 24px 32px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: #1a202c;
            font-weight: 800;
            letter-spacing: -0.025em;
        }

        .subtitle {
            color: #718096;
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            box-shadow: 0 2px 4px rgba(49, 130, 206, 0.2);
        }

        .btn:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        .btn-danger { background-color: #e53e3e; box-shadow: 0 2px 4px rgba(229, 62, 62, 0.2); }
        .btn-danger:hover { background-color: #c53030; }
        .btn-archive { background-color: #edf2f7; color: #4a5568; box-shadow: none; }
        .btn-archive:hover { background-color: #e2e8f0; }
        .btn-sync { background-color: #2b6cb0; }

        /* Modal for Cloud Settings */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }
        .modal-content h3 { margin-top: 0; color: #1a202c; }
        .modal-input {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px 0;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
        }

        .week-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 36px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-color);
        }

        .week-header {
            font-size: 1.4rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .date-input {
            font-size: 0.95rem;
            font-weight: 500;
            padding: 8px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #4a5568;
            background: #f8fafc;
            width: 260px;
            transition: all 0.2s;
        }

        .date-input:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
        }

        .table-responsive {
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 950px;
            background: #fff;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 12px;
            vertical-align: top;
        }

        th {
            background-color: #f1f5f9;
            font-size: 0.95rem;
            font-weight: 700;
            color: #475569;
            text-align: center;
        }

        .day-header-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .day-notes-input {
            width: 100%;
            height: 38px;
            padding: 4px 6px;
            border: 1px dashed #cbd5e0;
            border-radius: 6px;
            font-size: 0.78rem;
            font-family: inherit;
            background: #fffdf4;
            color: #744210;
            resize: vertical;
            box-sizing: border-box;
            text-align: center;
        }

        .day-notes-input:focus {
            outline: none;
            border-color: #d69e2e;
            background: #fff;
        }

        .holiday-label {
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            color: #e53e3e;
            cursor: pointer;
            background: #fff5f5;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #fed7d7;
        }

        th.day-col { width: 17%; }
        th.subject-col { width: 16%; text-align: left; background: #e2e8f0; color: #1e293b; }

        .category-row-header {
            font-weight: 700;
            font-size: 1rem;
            padding: 10px 16px;
            letter-spacing: 0.01em;
        }

        .category-row-header.joint { background-color: var(--joint-bg); color: #975a16; border-left: 6px solid var(--joint-main); }
        .category-row-header.tobias { background-color: var(--tobias-bg); color: var(--tobias-main); border-left: 6px solid var(--tobias-main); }
        .category-row-header.ariella { background-color: var(--ariella-bg); color: var(--ariella-main); border-left: 6px solid var(--ariella-main); }

        .subject-cell {
            font-weight: 600;
            font-size: 0.9rem;
            background: #f8fafc;
            vertical-align: middle;
            color: #334155;
            padding-left: 16px;
        }

        .lesson-cell-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        textarea.lesson-input {
            width: 100%;
            height: 60px;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.88rem;
            box-sizing: border-box;
            resize: vertical;
            font-family: inherit;
            background: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea.lesson-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
        }

        .row-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .status-select {
            padding: 5px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #f8fafc;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .status-select[data-status="done"] { background-color: #c6f6d5; color: #22543d; border-color: #9ae6b4; }
        .status-select[data-status="progress"] { background-color: #feebc8; color: #744210; border-color: #fbd38d; }
        .status-select[data-status="move"] { background-color: #e9d8fd; color: #441239; border-color: #d6bcfa; }
        .status-select[data-status="split"] { background-color: #fed7d7; color: #742a2a; border-color: #feb2b2; }

        .completed-cell textarea.lesson-input {
            text-decoration: line-through;
            opacity: 0.5;
            background: #f1f5f9;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.78rem;
            color: #4a5568;
            font-weight: 500;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        td.holiday-shaded, td.no-subject-shaded { 
            background-color: #edf2f7 !important; 
        }
        td.holiday-shaded textarea.lesson-input, td.no-subject-shaded textarea.lesson-input,
        td.holiday-shaded .status-select, td.no-subject-shaded .status-select { 
            opacity: 0.25; 
            pointer-events: none; 
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>📖 Homeschool Lesson Plan Book</h1>
            <div class="subtitle" id="sync-status">Status: Local Storage (Offline Mode)</div>
        </div>
        <div class="header-actions">
            <button class="btn btn-sync" onclick="openSyncModal()">⚙️ Cloud Sync</button>
            <button class="btn" onclick="addWeek()">+ Add Week</button>
            <button class="btn btn-danger" onclick="removeWeek()" id="remove-week-btn" style="display:none;">- Remove Week</button>
            <button class="btn btn-archive" onclick="archivePlanner()">Archive & Clear</button>
        </div>
    </header>

    <div id="planner-container"></div>
</div>

<!-- Sync Settings Modal -->
<div id="syncModal" class="modal">
    <div class="modal-content">
        <h3>☁️ Connect Cloud Sync</h3>
        <p style="font-size: 0.85rem; color: #64748b;">To sync between your computer and iPad, paste your free JSONBin details below:</p>
        <label style="font-size: 0.8rem; font-weight: bold;">JSONBin API Key:</label>
        <input type="text" id="apiKeyInput" class="modal-input" placeholder="e.g. $2a$10$...">
        <label style="font-size: 0.8rem; font-weight: bold;">Bin ID:</label>
        <input type="text" id="binIdInput" class="modal-input" placeholder="e.g. 64a8b... ">
        <div style="display: flex; justify-content: flex-end; gap: 10px;">
            <button class="btn btn-archive" onclick="closeSyncModal()">Cancel</button>
            <button class="btn" onclick="saveSyncSettings()">Connect & Sync</button>
        </div>
    </div>
</div>

<script>
    const days = [
        { id: 'mon', name: 'Monday' },
        { id: 'tue', name: 'Tuesday' },
        { id: 'wed', name: 'Wednesday' },
        { id: 'thu', name: 'Thursday' },
        { id: 'fri', name: 'Friday' }
    ];

    const sections = [
        {
            type: 'joint',
            title: '✨ Joint Routine (Both Kids)',
            subjects: [
                { id: 'joint-recitation', label: 'MP Recitation', placeholder: 'Memory verses...' },
                { id: 'joint-bible', label: 'MP Bible', placeholder: 'Lessons...' },
                { id: 'joint-enrichment', label: 'MP Enrichment', placeholder: 'Read-aloud & Art...' },
                { id: 'joint-prodigies', label: 'Prodigies Music', placeholder: 'Video & bells...' }
            ]
        },
        {
            type: 'tobias',
            title: '📘 Tobias',
            subjects: [
                { id: 'tobias-math', label: 'Math', placeholder: 'Textbook / Workbook...' },
                { id: 'tobias-loe', label: 'Reading', placeholder: 'Essentials Lesson...' },
                { id: 'tobias-latin', label: 'Memoria Press Latin', placeholder: 'Vocabulary & exercises...' },
                { id: 'tobias-piano', label: 'Piano', placeholder: 'Practice & scales...' }
            ]
        },
        {
            type: 'ariella',
            title: '🌸 Ariella',
            subjects: [
                { id: 'ariella-math', label: 'Math', placeholder: 'Lessons & workbook...' },
                { id: 'ariella-loe', label: 'Reading', placeholder: 'Foundations Level...' }
            ]
        }
    ];

    let totalWeeks = 2;
    let saveTimeout = null;

    function buildPlannerHTML() {
        const container = document.getElementById('planner-container');
        if (!container) return;

        let html = '';

        for (let w = 1; w <= totalWeeks; w++) {
            html += `
                <div class="week-card" id="week-${w}">
                    <div class="week-header">
                        <span>📅 Week ${w}</span>
                        <input type="text" class="date-input" id="week-date-${w}" placeholder="e.g., Nov 9 - Nov 13">
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th class="subject-col">Subject / Routine</th>
            `;

            days.forEach(day => {
                html += `
                    <th class="day-col">
                        <div class="day-header-content">
                            <span>${day.name}</span>
                            <textarea class="day-notes-input" id="day-note-w${w}-${day.id}" placeholder="Co-op, event, notes..."></textarea>
                            <label class="holiday-label">
                                <input type="checkbox" id="holiday-w${w}-${day.id}" onchange="toggleHoliday(${w}, '${day.id}')"> Holiday / Off
                            </label>
                        </div>
                    </th>
                `;
            });

            html += `
                                </tr>
                            </thead>
                            <tbody>
            `;

            sections.forEach(sec => {
                html += `
                    <tr>
                        <td colspan="${days.length + 1}" class="category-row-header ${sec.type}">${sec.title}</td>
                    </tr>
                `;

                sec.subjects.forEach(sub => {
                    html += `
                        <tr>
                            <td class="subject-cell">${sub.label}</td>
                    `;

                    days.forEach(day => {
                        const cellId = `w${w}-${sec.type}-${sub.id}-${day.id}`;
                        html += `
                            <td id="cell-${cellId}">
                                <div class="lesson-cell-content">
                                    <textarea class="lesson-input" placeholder="${sub.placeholder}"></textarea>
                                    <div class="row-controls">
                                        <div class="checkbox-group">
                                            <label class="checkbox-label">
                                                <input type="checkbox" onchange="toggleComplete('${cellId}')"> Done
                                            </label>
                                            <label class="checkbox-label" style="color:#e53e3e;">
                                                <input type="checkbox" id="nosub-${cellId}" onchange="toggleNoSubject('${cellId}')"> Off
                                            </label>
                                        </div>
                                        <select class="status-select" onchange="handleStatusChange(this, ${w}, '${sec.type}', '${sub.id}', '${day.id}')" data-status="pending">
                                            <option value="pending">Normal</option>
                                            <option value="progress">In Progress</option>
                                            <option value="done">Completed</option>
                                            <option value="move">Move ➔</option>
                                            <option value="split">Split ⚡</option>
                                        </select>
                                    </div>
                                </div>
                            </td>
                        `;
                    });

                    html += `</tr>`;
                });
            });

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        container.innerHTML = html;
        loadData();
        updateRemoveWeekButton();
    }

    function addWeek() {
        saveData();
        totalWeeks++;
        buildPlannerHTML();
        loadData();
        saveData();
    }

    function removeWeek() {
        if (totalWeeks > 2) {
            saveData();
            totalWeeks--;
            buildPlannerHTML();
            loadData();
            saveData();
        }
    }

    function updateRemoveWeekButton() {
        const btn = document.getElementById('remove-week-btn');
        if (!btn) return;
        btn.style.display = totalWeeks > 2 ? 'inline-block' : 'none';
    }

    function toggleHoliday(weekNum, dayId) {
        const checkbox = document.getElementById(`holiday-w${weekNum}-${dayId}`);
        const isHoliday = checkbox.checked;

        sections.forEach(sec => {
            sec.subjects.forEach(sub => {
                const cellId = `w${weekNum}-${sec.type}-${sub.id}-${dayId}`;
                const cell = document.getElementById(`cell-${cellId}`);
                if (cell) {
                    if (isHoliday) cell.classList.add('holiday-shaded');
                    else cell.classList.remove('holiday-shaded');
                }
            });
        });
        saveData();
    }

    function toggleNoSubject(cellId) {
        const cell = document.getElementById(`cell-${cellId}`);
        if (!cell) return;
        const noSubCb = document.getElementById(`nosub-${cellId}`);

        if (noSubCb.checked) {
            cell.classList.add('no-subject-shaded');
        } else {
            cell.classList.remove('no-subject-shaded');
        }
        saveData();
    }

    function toggleComplete(cellId) {
        const cell = document.getElementById(`cell-${cellId}`);
        if (!cell) return;
        const checkboxes = cell.querySelectorAll('input[type="checkbox"]');
        const doneCb = checkboxes[0];
        const select = cell.querySelector('.status-select');

        if (doneCb.checked) {
            cell.classList.add('completed-cell');
            select.value = 'done';
        } else {
            cell.classList.remove('completed-cell');
            if (select.value === 'done') select.value = 'pending';
        }
        updateStatusVisual(select);
        saveData();
    }

    function cascadeLessonsForward(startWeek, secType, subId, startIndex, newTextForStart) {
        let textToPush = newTextForStart;
        let currWeek = startWeek;
        let i = startIndex;

        while (textToPush && currWeek <= totalWeeks) {
            while (i < days.length) {
                const currentDayId = days[i].id;
                const cell = document.getElementById(`cell-w${currWeek}-${secType}-${subId}-${currentDayId}`);
                if (!cell) break;

                const input = cell.querySelector('.lesson-input');
                const existingText = input.value;

                input.value = textToPush;
                textToPush = existingText;

                i++;
                if (!textToPush) break;
            }

            if (textToPush && currWeek < totalWeeks) {
                currWeek++;
                i = 0;
            } else {
                break;
            }
        }
    }

    function handleStatusChange(selectElement, weekNum, secType, subId, dayId) {
        const val = selectElement.value;
        updateStatusVisual(selectElement);

        const dayIndex = days.findIndex(d => d.id === dayId);
        const currentCell = document.getElementById(`cell-w${weekNum}-${secType}-${subId}-${dayId}`);
        const currentInput = currentCell.querySelector('.lesson-input');
        const originalText = currentInput.value;

        if (val === 'move') {
            currentInput.value = "";
            cascadeLessonsForward(weekNum, secType, subId, dayIndex + 1, originalText);
        }

        if (val === 'split') {
            const part1 = originalText ? (originalText + " (Part 1)") : "Part 1";
            const part2 = originalText ? (originalText + " (Part 2)") : "Part 2";

            currentInput.value = part1;
            cascadeLessonsForward(weekNum, secType, subId, dayIndex + 1, part2);
        }

        saveData();
    }

    function updateStatusVisual(selectElement) {
        const val = selectElement.value;
        selectElement.setAttribute('data-status', val);

        const cell = selectElement.closest('td');
        if (!cell) return;
        const checkboxes = cell.querySelectorAll('input[type="checkbox"]');
        const doneCb = checkboxes[0];

        if (val === 'done') {
            doneCb.checked = true;
            cell.classList.add('completed-cell');
        } else {
            doneCb.checked = false;
            cell.classList.remove('completed-cell');
        }
    }

    function collectData() {
        const data = { totalWeeks: totalWeeks, weeksDates: {}, dayNotes: {}, holidays: {}, cells: {} };

        for (let w = 1; w <= totalWeeks; w++) {
            const dateInput = document.getElementById(`week-date-${w}`);
            if (dateInput) data.weeksDates[w] = dateInput.value;

            days.forEach(day => {
                const noteInput = document.getElementById(`day-note-w${w}-${day.id}`);
                if (noteInput) data.dayNotes[`w${w}-${day.id}`] = noteInput.value;

                const holidayCb = document.getElementById(`holiday-w${w}-${day.id}`);
                if (holidayCb) data.holidays[`w${w}-${day.id}`] = holidayCb.checked;
            });
        }

        document.querySelectorAll('td[id^="cell-"]').forEach(cell => {
            const id = cell.id.replace('cell-', '');
            const checkboxes = cell.querySelectorAll('input[type="checkbox"]');
            const doneCb = checkboxes[0];
            const noSubCb = checkboxes[1];
            const textInput = cell.querySelector('.lesson-input');
            const select = cell.querySelector('.status-select');

            if (doneCb && textInput && select) {
                data.cells[id] = {
                    checked: doneCb.checked,
                    noSubject: noSubCb ? noSubCb.checked : false,
                    text: textInput.value,
                    status: select.value
                };
            }
        });
        return data;
    }

    function saveData() {
        const data = collectData();
        localStorage.setItem('homeschoolPlannerHorizontal_v11', JSON.stringify(data));

        const apiKey = localStorage.getItem('jsonbin_apikey');
        const binId = localStorage.getItem('jsonbin_binid');

        if (apiKey && binId) {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                syncToCloud(apiKey, binId, data);
            }, 1000);
        }
    }

    async function syncToCloud(apiKey, binId, data) {
        const statusEl = document.getElementById('sync-status');
        statusEl.innerText = "Status: Syncing to cloud...";
        try {
            const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': apiKey
                },
                body: JSON.stringify(data)
            });
            if (response.ok) {
                statusEl.innerText = "Status: Cloud Synced ✨";
            } else {
                statusEl.innerText = "Status: Sync Failed (Check API Key)";
            }
        } catch (e) {
            statusEl.innerText = "Status: Offline (Using Local)";
        }
    }

    async function loadData() {
        const apiKey = localStorage.getItem('jsonbin_apikey');
        const binId = localStorage.getItem('jsonbin_binid');

        let data = null;

        if (apiKey && binId) {
            const statusEl = document.getElementById('sync-status');
            statusEl.innerText = "Status: Loading from cloud...";
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
                    headers: { 'X-Master-Key': apiKey }
                });
                if (res.ok) {
                    const json = await res.json();
                    data = json.record;
                    statusEl.innerText = "Status: Cloud Synced ✨";
                }
            } catch (e) {
                console.log("Cloud load failed, falling back to local storage");
            }
        }

        if (!data) {
            const saved = localStorage.getItem('homeschoolPlannerHorizontal_v11');
            if (saved) data = JSON.parse(saved);
        }

        if (!data) return;

        try {
            if (data.totalWeeks && data.totalWeeks > totalWeeks) {
                totalWeeks = data.totalWeeks;
                buildPlannerHTML();
            }

            if (data.weeksDates) {
                Object.keys(data.weeksDates).forEach(w => {
                    const dateInput = document.getElementById(`week-date-${w}`);
                    if (dateInput) dateInput.value = data.weeksDates[w];
                });
            }

            if (data.dayNotes) {
                Object.keys(data.dayNotes).forEach(key => {
                    const noteInput = document.getElementById(`day-note-${key}`);
                    if (noteInput) noteInput.value = data.dayNotes[key];
                });
            }

            if (data.holidays) {
                Object.keys(data.holidays).forEach(key => {
                    const isOff = data.holidays[key];
                    const checkbox = document.getElementById(`holiday-${key}`);
                    if (checkbox && isOff) {
                        checkbox.checked = true;
                        const parts = key.split('-');
                        const wNum = parts[0].replace('w', '');
                        const dayId = parts[1];
                        
                        sections.forEach(sec => {
                            sec.subjects.forEach(sub => {
                                const cellId = `w${wNum}-${sec.type}-${sub.id}-${dayId}`;
                                const cell = document.getElementById(`cell-${cellId}`);
                                if (cell) cell.classList.add('holiday-shaded');
                            });
                        });
                    }
                });
            }

            if (data.cells) {
                Object.keys(data.cells).forEach(id => {
                    const cell = document.getElementById(`cell-${id}`);
                    if (cell) {
                        const item = data.cells[id];
                        const checkboxes = cell.querySelectorAll('input[type="checkbox"]');
                        const doneCb = checkboxes[0];
                        const noSubCb = checkboxes[1];
                        const textInput = cell.querySelector('.lesson-input');
                        const select = cell.querySelector('.status-select');

                        if (doneCb && textInput && select) {
                            doneCb.checked = item.checked || false;
                            if (noSubCb) {
                                noSubCb.checked = item.noSubject || false;
                                if (item.noSubject) cell.classList.add('no-subject-shaded');
                                else cell.classList.remove('no-subject-shaded');
                            }
                            textInput.value = item.text || '';
                            select.value = item.status || 'pending';

                            if (item.checked) cell.classList.add('completed-cell');
                            else cell.classList.remove('completed-cell');

                            select.setAttribute('data-status', item.status || 'pending');
                        }
                    }
                });
            }
        } catch (e) {
            console.log("Error loading data", e);
        }
    }

    function openSyncModal() {
        document.getElementById('syncModal').style.display = 'flex';
        document.getElementById('apiKeyInput').value = localStorage.getItem('jsonbin_apikey') || '';
        document.getElementById('binIdInput').value = localStorage.getItem('jsonbin_binid') || '';
    }
    function closeSyncModal() {
        document.getElementById('syncModal').style.display = 'none';
    }
    function saveSyncSettings() {
        const key = document.getElementById('apiKeyInput').value.trim();
        const bin = document.getElementById('binIdInput').value.trim();
        localStorage.setItem('jsonbin_apikey', key);
        localStorage.setItem('jsonbin_binid', bin);
        closeSyncModal();
        alert("Cloud settings saved! Reloading planner...");
        location.reload();
    }

    document.addEventListener('input', (e) => {
        if (e.target.classList.contains('lesson-input') || e.target.classList.contains('date-input') || e.target.classList.contains('day-notes-input')) {
            saveData();
        }
    });

    function archivePlanner() {
        if (confirm("Are you sure you want to clear and archive this planner?")) {
            localStorage.removeItem('homeschoolPlannerHorizontal_v11');
            const apiKey = localStorage.getItem('jsonbin_apikey');
            const binId = localStorage.getItem('jsonbin_binid');
            if (apiKey && binId) syncToCloud(apiKey, binId, collectData());
            totalWeeks = 2;
            buildPlannerHTML();
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        buildPlannerHTML();
        if (localStorage.getItem('jsonbin_apikey') && localStorage.getItem('jsonbin_binid')) {
            loadData();
        }
    });
</script>

</body>
</html>
