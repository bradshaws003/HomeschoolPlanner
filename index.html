<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homeschool Lesson Plan Book</title>
    <style>
        :root {
            --tobias-main: #2b6cb0;
            --tobias-bg: #ebf8ff;
            --ariella-main: #d53f8c;
            --ariella-bg: #fff5f7;
            --joint-main: #d69e2e;
            --joint-bg: #fffff0;
            --text: #2d3748;
            --bg-body: #f7fafc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text);
            margin: 0;
            padding: 16px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #fff;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #1a202c;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn:hover { background-color: #2b6cb0; }
        .btn-archive { background-color: #e2e8f0; color: #4a5568; }
        .btn-archive:hover { background-color: #cbd5e0; }

        .week-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 28px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
            border: 2px solid #e2e8f0;
        }

        .week-header {
            font-size: 1.3rem;
            font-weight: 800;
            color: #2d3748;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid #edf2f7;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th, td {
            border: 1px solid #cbd5e0;
            padding: 10px;
            vertical-align: middle;
        }

        th {
            background-color: #edf2f7;
            font-size: 0.9rem;
            font-weight: 700;
            color: #4a5568;
            text-align: center;
        }

        th.day-col {
            width: 18%;
        }

        th.subject-col {
            width: 28%;
            text-align: left;
        }

        .category-row-header {
            background-color: #f7fafc;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 8px 12px;
        }

        .category-row-header.joint { background-color: var(--joint-bg); color: #b7791f; border-left: 5px solid var(--joint-main); }
        .category-row-header.tobias { background-color: var(--tobias-bg); color: var(--tobias-main); border-left: 5px solid var(--tobias-main); }
        .category-row-header.ariella { background-color: var(--ariella-bg); color: var(--ariella-main); border-left: 5px solid var(--ariella-main); }

        .subject-cell {
            font-weight: 600;
            font-size: 0.9rem;
            background: #fff;
        }

        .lesson-cell-content {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .lesson-input {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font-size: 0.85rem;
            box-sizing: border-box;
        }

        .lesson-input:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 2px rgba(66, 153, 225, 0.2);
        }

        .row-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-select {
            padding: 4px;
            border-radius: 4px;
            border: 1px solid #cbd5e0;
            background: #fff;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        .status-select[data-status="done"] { background-color: #c6f6d5; color: #22543d; border-color: #9ae6b4; }
        .status-select[data-status="progress"] { background-color: #feebc8; color: #744210; border-color: #fbd38d; }
        .status-select[data-status="move"] { background-color: #e9d8fd; color: #441239; border-color: #d6bcfa; }
        .status-select[data-status="split"] { background-color: #fed7d7; color: #742a2a; border-color: #feb2b2; }

        .completed-cell .lesson-input {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .checkbox-label {
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            color: #4a5568;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>📖 Homeschool Lesson Plan Book</h1>
            <small style="color: #718096;">Horizontal Weekly Grid</small>
        </div>
        <div class="header-actions">
            <button class="btn" id="add-week-btn" onclick="toggleWeek3()">+ Add Week 3</button>
            <button class="btn btn-archive" onclick="archivePlanner()">Archive & Clear</button>
        </div>
    </header>

    <div id="planner-container"></div>
</div>

<script>
    const days = [
        { id: 'mon', name: 'Monday' },
        { id: 'tue', name: 'Tuesday' },
        { id: 'wed', name: 'Wednesday' },
        { id: 'thu', name: 'Thursday' },
        { id: 'fri', name: 'Friday' }
    ];

    const sections = [
        {
            type: 'joint',
            title: '✨ Joint Routine (Both Kids)',
            subjects: [
                { id: 'joint-recitation', label: 'MP Recitation', placeholder: 'Memory verses...' },
                { id: 'joint-bible', label: 'MP Bible', placeholder: 'Lessons...' },
                { id: 'joint-enrichment', label: 'MP Enrichment', placeholder: 'Read-aloud & Art...' },
                { id: 'joint-prodigies', label: 'Prodigies Music', placeholder: 'Video & bells...' }
            ]
        },
        {
            type: 'tobias',
            title: '📘 Tobias',
            subjects: [
                { id: 'tobias-math', label: 'Singapore Math', placeholder: 'Textbook / Workbook...' },
                { id: 'tobias-loe', label: 'Logic of English', placeholder: 'Essentials Lesson...' },
                { id: 'tobias-latin', label: 'Memoria Press Latin', placeholder: 'Vocabulary & exercises...' },
                { id: 'tobias-piano', label: 'Piano', placeholder: 'Practice & scales...' }
            ]
        },
        {
            type: 'ariella',
            title: '🌸 Ariella',
            subjects: [
                { id: 'ariella-math', label: 'Singapore Math', placeholder: 'Lessons & workbook...' },
                { id: 'ariella-loe', label: 'Logic of English', placeholder: 'Foundations Level...' }
            ]
        }
    ];

    let totalWeeks = 2;

    function buildPlannerHTML() {
        const container = document.getElementById('planner-container');
        let html = '';

        for (let w = 1; w <= totalWeeks; w++) {
            html += `
                <div class="week-card" id="week-${w}">
                    <div class="week-header">📅 Week ${w}</div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th class="subject-col">Subject / Routine</th>
            `;

            days.forEach(day => {
                html += `<th class="day-col">${day.name}</th>`;
            });

            html += `
                                </tr>
                            </thead>
                            <tbody>
            `;

            sections.forEach(sec => {
                html += `
                    <tr>
                        <td colspan="${days.length + 1}" class="category-row-header ${sec.type}">${sec.title}</td>
                    </tr>
                `;

                sec.subjects.forEach(sub => {
                    html += `
                        <tr>
                            <td class="subject-cell">${sub.label}</td>
                    `;

                    days.forEach(day => {
                        const cellId = `w${w}-${sec.type}-${sub.id}-${day.id}`;
                        html += `
                            <td id="cell-${cellId}">
                                <div class="lesson-cell-content">
                                    <input type="text" class="lesson-input" placeholder="${sub.placeholder}">
                                    <div class="row-controls">
                                        <label class="checkbox-label">
                                            <input type="checkbox" onchange="toggleComplete('${cellId}')"> Done
                                        </label>
                                        <select class="status-select" onchange="updateStatus(this)" data-status="pending">
                                            <option value="pending">Normal</option>
                                            <option value="progress">In Progress</option>
                                            <option value="done">Completed</option>
                                            <option value="move">Move Day</option>
                                            <option value="split">Split</option>
                                        </select>
                                    </div>
                                </div>
                            </td>
                        `;
                    });

                    html += `</tr>`;
                });
            });

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        container.innerHTML = html;
        loadData();
        updateWeek3ButtonText();
    }

    function toggleWeek3() {
        totalWeeks = (totalWeeks === 2) ? 3 : 2;
        buildPlannerHTML();
        saveData();
    }

    function updateWeek3ButtonText() {
        const btn = document.getElementById('add-week-btn');
        if (totalWeeks === 3) {
            btn.innerText = '- Remove Week 3';
            btn.style.backgroundColor = '#e53e3e';
        } else {
            btn.innerText = '+ Add Week 3';
            btn.style.backgroundColor = '#3182ce';
        }
    }

    function toggleComplete(cellId) {
        const cell = document.getElementById(`cell-${cellId}`);
        const checkbox = cell.querySelector('input[type="checkbox"]');
        const select = cell.querySelector('.status-select');

        if (checkbox.checked) {
            cell.classList.add('completed-cell');
            select.value = 'done';
        } else {
            cell.classList.remove('completed-cell');
            if (select.value === 'done') select.value = 'pending';
        }
        updateStatus(select);
    }

    function updateStatus(selectElement) {
        const val = selectElement.value;
        selectElement.setAttribute('data-status', val);

        const cell = selectElement.closest('td');
        const checkbox = cell.querySelector('input[type="checkbox"]');

        if (val === 'done') {
            checkbox.checked = true;
            cell.classList.add('completed-cell');
        } else {
            checkbox.checked = false;
            cell.classList.remove('completed-cell');
        }
        saveData();
    }

    function saveData() {
        const data = { totalWeeks: totalWeeks, cells: {} };
        document.querySelectorAll('td[id^="cell-"]').forEach(cell => {
            const id = cell.id.replace('cell-', '');
            data.cells[id] = {
                checked: cell.querySelector('input[type="checkbox"]').checked,
                text: cell.querySelector('.lesson-input').value,
                status: cell.querySelector('.status-select').value
            };
        });
        localStorage.setItem('homeschoolPlannerHorizontal', JSON.stringify(data));
    }

    function loadData() {
        const saved = localStorage.getItem('homeschoolPlannerHorizontal');
        if (!saved) return;
        const data = JSON.parse(saved);

        if (data.totalWeeks && data.totalWeeks !== totalWeeks) {
            totalWeeks = data.totalWeeks;
            buildPlannerHTML();
            return;
        }

        if (data.cells) {
            Object.keys(data.cells).forEach(id => {
                const cell = document.getElementById(`cell-${id}`);
                if (cell) {
                    const item = data.cells[id];
                    const checkbox = cell.querySelector('input[type="checkbox"]');
                    const textInput = cell.querySelector('.lesson-input');
                    const select = cell.querySelector('.status-select');

                    checkbox.checked = item.checked;
                    textInput.value = item.text;
                    select.value = item.status;

                    if (item.checked) cell.classList.add('completed-cell');
                    select.setAttribute('data-status', item.status);
                }
            });
        }
    }

    document.addEventListener('input', (e) => {
        if (e.target.classList.contains('lesson-input')) {
            saveData();
        }
    });

    function archivePlanner() {
        if (confirm("Are you sure you want to clear and archive this planner?")) {
            localStorage.removeItem('homeschoolPlannerHorizontal');
            totalWeeks = 2;
            buildPlannerHTML();
        }
    }

    buildPlannerHTML();
</script>

</body>
</html>
