<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homeschool Lesson Plan Book</title>
    <style>
        :root {
            --tobias-main: #2b6cb0;
            --tobias-bg: #ebf8ff;
            --ariella-main: #d53f8c;
            --ariella-bg: #fff5f7;
            --joint-main: #d69e2e;
            --joint-bg: #fffff0;
            --text: #2d3748;
            --bg-body: #f7fafc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text);
            margin: 0;
            padding: 16px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #fff;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #1a202c;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn:hover { background-color: #2b6cb0; }
        .btn-danger { background-color: #e53e3e; }
        .btn-danger:hover { background-color: #c53030; }
        .btn-archive { background-color: #e2e8f0; color: #4a5568; }
        .btn-archive:hover { background-color: #cbd5e0; }

        .week-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 28px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
            border: 2px solid #e2e8f0;
        }

        .week-header {
            font-size: 1.3rem;
            font-weight: 800;
            color: #2d3748;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid #edf2f7;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .date-input {
            font-size: 0.95rem;
            font-weight: 600;
            padding: 6px 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            color: #4a5568;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th, td {
            border: 1px solid #cbd5e0;
            padding: 8px;
            vertical-align: top;
        }

        th {
            background-color: #edf2f7;
            font-size: 0.9rem;
            font-weight: 700;
            color: #4a5568;
            text-align: center;
        }

        .day-header-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .holiday-label {
            font-size: 0.7rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 3px;
            color: #c53030;
            cursor: pointer;
        }

        th.day-col { width: 17%; }
        th.subject-col { width: 15%; text-align: left; }

        .category-row-header {
            font-weight: 700;
            font-size: 0.95rem;
            padding: 8px 12px;
        }

        .category-row-header.joint { background-color: var(--joint-bg); color: #b7791f; border-left: 5px solid var(--joint-main); }
        .category-row-header.tobias { background-color: var(--tobias-bg); color: var(--tobias-main); border-left: 5px solid var(--tobias-main); }
        .category-row-header.ariella { background-color: var(--ariella-bg); color: var(--ariella-main); border-left: 5px solid var(--ariella-main); }

        .subject-cell {
            font-weight: 600;
            font-size: 0.88rem;
            background: #fff;
            vertical-align: middle;
        }

        .lesson-cell-content {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        textarea.lesson-input {
            width: 100%;
            height: 52px;
            padding: 6px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font-size: 0.85rem;
            box-sizing: border-box;
            resize: vertical;
            font-family: inherit;
        }

        textarea.lesson-input:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 2px rgba(66, 153, 225, 0.2);
        }

        .row-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }

        .status-select {
            padding: 4px;
            border-radius: 4px;
            border: 1px solid #cbd5e0;
            background: #fff;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        .status-select[data-status="done"] { background-color: #c6f6d5; color: #22543d; border-color: #9ae6b4; }
        .status-select[data-status="progress"] { background-color: #feebc8; color: #744210; border-color: #fbd38d; }
        .status-select[data-status="move"] { background-color: #e9d8fd; color: #441239; border-color: #d6bcfa; }
        .status-select[data-status="split"] { background-color: #fed7d7; color: #742a2a; border-color: #feb2b2; }

        .completed-cell textarea.lesson-input {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: #4a5568;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
        }

        td.holiday-shaded, td.no-subject-shaded { background-color: #e2e8f0 !important; }
        td.holiday-shaded .lesson-cell-content, td.no-subject-shaded .lesson-cell-content { opacity: 0.3; pointer-events: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>📖 Homeschool Lesson Plan Book</h1>
            <small style="color: #718096;">Horizontal Grid with Per-Subject Off Toggles</small>
        </div>
        <div class="header-actions">
            <button class="btn" onclick="addWeek()">+ Add Week</button>
            <button class="btn btn-danger" onclick="removeWeek()" id="remove-week-btn" style="display:none;">- Remove Week</button>
            <button class="btn btn-archive" onclick="archivePlanner()">Archive & Clear</button>
        </div>
    </header>

    <div id="planner-container"></div>
</div>

<script>
    const days = [
        { id: 'mon', name: 'Monday' },
        { id: 'tue', name: 'Tuesday' },
        { id: 'wed', name: 'Wednesday' },
        { id: 'thu', name: 'Thursday' },
        { id: 'fri', name: 'Friday' }
    ];

    const sections = [
        {
            type: 'joint',
            title: '✨ Joint Routine (Both Kids)',
            subjects: [
                { id: 'joint-recitation', label: 'MP Recitation', placeholder: 'Memory verses...' },
                { id: 'joint-bible', label: 'MP Bible', placeholder: 'Lessons...' },
                { id: 'joint-enrichment', label: 'MP Enrichment', placeholder: 'Read-aloud & Art...' },
                { id: 'joint-prodigies', label: 'Prodigies Music', placeholder: 'Video & bells...' }
            ]
        },
        {
            type: 'tobias',
            title: '📘 Tobias',
            subjects: [
                { id: 'tobias-math', label: 'Singapore Math', placeholder: 'Textbook / Workbook...' },
                { id: 'tobias-loe', label: 'Logic of English', placeholder: 'Essentials Lesson...' },
                { id: 'tobias-latin', label: 'Memoria Press Latin', placeholder: 'Vocabulary & exercises...' },
                { id: 'tobias-piano', label: 'Piano', placeholder: 'Practice & scales...' }
            ]
        },
        {
            type: 'ariella',
            title: '🌸 Ariella',
            subjects: [
                { id: 'ariella-math', label: 'Singapore Math', placeholder: 'Lessons & workbook...' },
                { id: 'ariella-loe', label: 'Logic of English', placeholder: 'Foundations Level...' }
            ]
        }
    ];

    let totalWeeks = 2;

    function buildPlannerHTML() {
        const container = document.getElementById('planner-container');
        if (!container) return;

        let html = '';

        for (let w = 1; w <= totalWeeks; w++) {
            html += `
                <div class="week-card" id="week-${w}">
                    <div class="week-header">
                        <span>📅 Week ${w}</span>
                        <input type="text" class="date-input" id="week-date-${w}" placeholder="Enter dates (e.g. Nov 9 - Nov 13)">
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th class="subject-col">Subject / Routine</th>
            `;

            days.forEach(day => {
                html += `
                    <th class="day-col">
                        <div class="day-header-content">
                            <span>${day.name}</span>
                            <label class="holiday-label">
                                <input type="checkbox" id="holiday-w${w}-${day.id}" onchange="toggleHoliday(${w}, '${day.id}')"> Holiday / Off
                            </label>
                        </div>
                    </th>
                `;
            });

            html += `
                                </tr>
                            </thead>
                            <tbody>
            `;

            sections.forEach(sec => {
                html += `
                    <tr>
                        <td colspan="${days.length + 1}" class="category-row-header ${sec.type}">${sec.title}</td>
                    </tr>
                `;

                sec.subjects.forEach(sub => {
                    html += `
                        <tr>
                            <td class="subject-cell">${sub.label}</td>
                    `;

                    days.forEach(day => {
                        const cellId = `w${w}-${sec.type}-${sub.id}-${day.id}`;
                        html += `
                            <td id="cell-${cellId}">
                                <div class="lesson-cell-content">
                                    <textarea class="lesson-input" placeholder="${sub.placeholder}"></textarea>
                                    <div class="row-controls">
                                        <div class="checkbox-group">
                                            <label class="checkbox-label">
                                                <input type="checkbox" onchange="toggleComplete('${cellId}')"> Done
                                            </label>
                                            <label class="checkbox-label" style="color:#c53030;">
                                                <input type="checkbox" id="nosub-${cellId}" onchange="toggleNoSubject('${cellId}')"> Off
                                            </label>
                                        </div>
                                        <select class="status-select" onchange="handleStatusChange(this, ${w}, '${sec.type}', '${sub.id}', '${day.id}')" data-status="pending">
                                            <option value="pending">Normal</option>
                                            <option value="progress">In Progress</option>
                                            <option value="done">Completed</option>
                                            <option value="move">Move Day ➔</option>
                                            <option value="split">Split Lesson ⚡</option>
                                        </select>
                                    </div>
                                </div>
                            </td>
                        `;
                    });

                    html += `</tr>`;
                });
            });

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        container.innerHTML = html;
        loadData();
        updateRemoveWeekButton();
    }

    function addWeek() {
        totalWeeks++;
        buildPlannerHTML();
        saveData();
    }

    function removeWeek() {
        if (totalWeeks > 1) {
            totalWeeks--;
            buildPlannerHTML();
            saveData();
        }
    }

    function updateRemoveWeekButton() {
        const btn = document.getElementById('remove-week-btn');
        if (!btn) return;
        btn.style.display = totalWeeks > 2 ? 'inline-block' : 'none';
    }

    function toggleHoliday(weekNum, dayId) {
        const checkbox = document.getElementById(`holiday-w${weekNum}-${dayId}`);
        const isHoliday = checkbox.checked;

        sections.forEach(sec => {
            sec.subjects.forEach(sub => {
                const cellId = `w${weekNum}-${sec.type}-${sub.id}-${dayId}`;
                const cell = document.getElementById(`cell-${cellId}`);
                if (cell) {
                    if (isHoliday) cell.classList.add('holiday-shaded');
                    else cell.classList.remove('holiday-shaded');
                }
            });
        });
        saveData();
    }

    function toggleNoSubject(cellId) {
        const cell = document.getElementById(`cell-${cellId}`);
        if (!cell) return;
        const noSubCb = document.getElementById(`nosub-${cellId}`);

        if (noSubCb.checked) {
            cell.classList.add('no-subject-shaded');
        } else {
            cell.classList.remove('no-subject-shaded');
        }
        saveData();
    }

    function toggleComplete(cellId) {
        const cell = document.getElementById(`cell-${cellId}`);
        if (!cell) return;
        const checkboxes = cell.querySelectorAll('input[type="checkbox"]');
        const doneCb = checkboxes[0]; // First checkbox is Done
        const select = cell.querySelector('.status-select');

        if (doneCb.checked) {
            cell.classList.add('completed-cell');
            select.value = 'done';
        } else {
            cell.classList.remove('completed-cell');
            if (select.value === 'done') select.value = 'pending';
        }
        updateStatusVisual(select);
        saveData();
    }

    function cascadeLessonsForward(weekNum, secType, subId, startIndex, newTextForStart) {
        let textToPush = newTextForStart;

        for (let i = startIndex; i < days.length; i++) {
            const currentDayId = days[i].id;
            const cell = document.getElementById(`cell-w${weekNum}-${secType}-${subId}-${currentDayId}`);
            if (!cell) break;

            const input = cell.querySelector('.lesson-input');
            const existingText = input.value;

            input.value = textToPush;
            textToPush = existingText;

            if (!textToPush) break;
        }
    }

    function handleStatusChange(selectElement, weekNum, secType, subId, dayId) {
        const val = selectElement.value;
        updateStatusVisual(selectElement);

        const dayIndex = days.findIndex(d => d.id === dayId);
        const currentCell = document.getElementById(`cell-w${weekNum}-${secType}-${subId}-${dayId}`);
        const currentInput = currentCell.querySelector('.lesson-input');
        const originalText = currentInput.value;

        if (val === 'move') {
            if (dayIndex < days.length - 1) {
                currentInput.value = "";
                cascadeLessonsForward(weekNum, secType, subId, dayIndex + 1, originalText);
            } else {
                alert("You are on Friday! To move lessons to next week, you can copy them over manually.");
            }
        }

        if (val === 'split') {
            if (dayIndex < days.length - 1) {
                const part1 = originalText ? (originalText + " (Part 1)") : "Part 1";
                const part2 = originalText ? (originalText + " (Part 2)") : "Part 2";

                currentInput.value = part1;
                cascadeLessonsForward(weekNum, secType, subId, dayIndex + 1, part2);
            } else {
                alert("Cannot split past Friday in the same week.");
            }
        }

        saveData();
    }

    function updateStatusVisual(selectElement) {
        const val = selectElement.value;
        selectElement.setAttribute('data-status', val);

        const cell = selectElement.closest('td');
        if (!cell) return;
        const checkboxes = cell.querySelectorAll('input[type="checkbox"]');
        const doneCb = checkboxes[0];

        if (val === 'done') {
            doneCb.checked = true;
            cell.classList.add('completed-cell');
        } else {
            doneCb.checked = false;
            cell.classList.remove('completed-cell');
        }
    }

    function saveData() {
        const data = { totalWeeks: totalWeeks, weeksDates: {}, holidays: {}, noSubjects: {}, cells: {} };

        for (let w = 1; w <= totalWeeks; w++) {
            const dateInput = document.getElementById(`week-date-${w}`);
            if (dateInput) data.weeksDates[w] = dateInput.value;

            days.forEach(day => {
                const holidayCb = document.getElementById(`holiday-w${w}-${day.id}`);
                if (holidayCb) data.holidays[`w${w}-${day.id}`] = holidayCb.checked;
            });
        }

        document.querySelectorAll('td[id^="cell-"]').forEach(cell => {
            const id = cell.id.replace('cell-', '');
            const checkboxes = cell.querySelectorAll('input[type="checkbox"]');
            const doneCb = checkboxes[0];
            const noSubCb = checkboxes[1];
            const textInput = cell.querySelector('.lesson-input');
            const select = cell.querySelector('.status-select');

            if (doneCb && textInput && select) {
                data.cells[id] = {
                    checked: doneCb.checked,
                    noSubject: noSubCb ? noSubCb.checked : false,
                    text: textInput.value,
                    status: select.value
                };
            }
        });

        localStorage.setItem('homeschoolPlannerHorizontal_v6', JSON.stringify(data));
    }

    function loadData() {
        const saved = localStorage.getItem('homeschoolPlannerHorizontal_v6');
        if (!saved) return;

        try {
            const data = JSON.parse(saved);
            if (data.totalWeeks && data.totalWeeks !== totalWeeks) {
                totalWeeks = data.totalWeeks;
                buildPlannerHTML();
                return;
            }

            if (data.weeksDates) {
                Object.keys(data.weeksDates).forEach(w => {
                    const dateInput = document.getElementById(`week-date-${w}`);
                    if (dateInput) dateInput.value = data.weeksDates[w];
                });
            }

            if (data.holidays) {
                Object.keys(data.holidays).forEach(key => {
                    const isOff = data.holidays[key];
                    const checkbox = document.getElementById(`holiday-${key}`);
                    if (checkbox && isOff) {
                        checkbox.checked = true;
                        const parts = key.split('-');
                        const wNum = parts[0].replace('w', '');
                        const dayId = parts[1];
                        
                        sections.forEach(sec => {
                            sec.subjects.forEach(sub => {
                                const cellId = `w${wNum}-${sec.type}-${sub.id}-${dayId}`;
                                const cell = document.getElementById(`cell-${cellId}`);
                                if (cell) cell.classList.add('holiday-shaded');
                            });
                        });
                    }
                });
            }

            if (data.cells) {
                Object.keys(data.cells).forEach(id => {
                    const cell = document.getElementById(`cell-${id}`);
                    if (cell) {
                        const item = data.cells[id];
                        const checkboxes = cell.querySelectorAll('input[type="checkbox"]');
                        const doneCb = checkboxes[0];
                        const noSubCb = checkboxes[1];
                        const textInput = cell.querySelector('.lesson-input');
                        const select = cell.querySelector('.status-select');

                        if (doneCb && textInput && select) {
                            doneCb.checked = item.checked || false;
                            if (noSubCb) {
                                noSubCb.checked = item.noSubject || false;
                                if (item.noSubject) cell.classList.add('no-subject-shaded');
                            }
                            textInput.value = item.text || '';
                            select.value = item.status || 'pending';

                            if (item.checked) cell.classList.add('completed-cell');
                            select.setAttribute('data-status', item.status || 'pending');
                        }
                    }
                });
            }
        } catch (e) {
            console.log("Error loading saved data", e);
        }
    }

    document.addEventListener('input', (e) => {
        if (e.target.classList.contains('lesson-input') || e.target.classList.contains('date-input')) {
            saveData();
        }
    });

    function archivePlanner() {
        if (confirm("Are you sure you want to clear and archive this planner?")) {
            localStorage.removeItem('homeschoolPlannerHorizontal_v6');
            totalWeeks = 2;
            buildPlannerHTML();
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        buildPlannerHTML();
    });
</script>

</body>
</html>
